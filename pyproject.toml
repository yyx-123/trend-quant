[project]
name = "trend-etf-system"
version = "0.1.0"
description = "A-share ETF trend trading system skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "jinja2>=3.1.6",
  "apscheduler>=3.11.0",
  "pandas>=2.3.0",
  "numpy>=2.2.0",
  "pyyaml>=6.0.2",
  "pyarrow>=21.0.0",
  "pydantic>=2.11.0",
  "email-validator>=2.2.0",
  "httpx>=0.28.0",
  "tickflow[all]==0.1.24",
  "chinese_calendar>=1.10.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.0.0"
]

[project.optional-dependencies]
# 仅季度快照脚本需要（scripts/fetch_etf_holdings.py、scripts/sync_sw_tushare.py）。
# 应用运行时对 tushare 零依赖；临时账号窗口期前手动安装：
#   .venv/Scripts/pip install -e ".[tushare]"   或   .venv/Scripts/pip install tushare
tushare = ["tushare>=1.4.0"]
# 开发/测试工具链：pip install -e ".[dev]"
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mcp>=1.0.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 忽略的均为有意为之（逐条注明），其余默认规则全量生效：
ignore = [
  # 系统事件时间戳刻意用宿主机本地时钟；交易/会话语义一律走
  # core.calendar.market_now()（P1-5 约定，写入 CLAUDE.md）
  "DTZ001", "DTZ005", "DTZ007", "DTZ011",
  "BLE001",  # best-effort 兜底为既定风格（均有 logger 记录）
  "B008",    # FastAPI Depends/Field 默认参数调用即框架惯用法
  "S110",    # 个别有意静默（core/calendar.py:50-51 有注释说明意图）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: 单元测试（快速，无 IO）",
    "integration: 集成测试（真实类 + 隔离数据）",
    "api: API 测试（FastAPI TestClient）",
    "slow: 慢速测试（回测引擎全量运行等）",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py", "*/__init__.py", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "class .*Protocol",
]
