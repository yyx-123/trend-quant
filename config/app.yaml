app:
  timezone: Asia/Shanghai
  data_provider_priority:
    - tickflow
  update_time_after_close: "16:30"
  daily_update_max_retries: 2
  daily_update_retry_interval_seconds: 5

# TickFlow CN subscription limits. The application uses the authenticated API
# endpoint only; the unregistered trial endpoint is deliberately not configured
# or used. 各档位限额见官方定价页：https://tickflow.org/pricing/
#
# 【会员状态】当前为付费年会员，有效期至约 2027-08（2026-08 续费）。
# 到期前请续费 —— 2026-08-10 事故记录：会员过期未续自动降级为 Starter 体验档，
# 实时行情限额骤降（批量最大 5 标的/次、10 次/分钟），导致交易记录列表逐标的
# 请求撞 429 重试、接口耗时 115 秒；充值续费后原限额（批量 50、60/min）恢复。
# 若行情接口突发大量 400「标的数量超限」/ 429「请求频率超限」，先查会员状态。
tickflow:
  plan: starter
  api_base_url: "https://api.tickflow.org"
  daily_kline_batch_size: 100
  daily_kline_batch_requests_per_minute: 30
  daily_kline_batch_max_workers: 1
  # 注意：ex-factors 除权因子接口批量上限为 50 标的/次（低于日K批量的 100），
  # 超限返回 400「标的数量超限」；provider_tickflow.fetch_ex_factors 已按 50 分批。
  daily_kline_single_requests_per_minute: 60
  # 实时行情限额（付费档实测 2026-08-10：单请求 18 标的、5.5s 12 连发均通过；
  # Starter 降级档实测：批量最大 5 标的、10/min，超限返回 400/429）。
  quote_max_symbols_per_request: 50
  quote_requests_per_minute: 60

logging:
  level: INFO
