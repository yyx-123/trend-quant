{% extends "base.html" %}
{% block content %}
<section class="page-panel market-view-page">
  <div class="bt-form-row market-toolbar">
    <label class="mv-symbol-search-label">标的
      <input id="mvSymbolSearch" type="text" list="mvSymbolOptions" placeholder="输入代码、名称或分类搜索" autocomplete="off">
      <datalist id="mvSymbolOptions"></datalist>
    </label>
    <label class="mv-symbol-code-label">代码
      <input id="mvSymbolInput" type="text" placeholder="如 518850 或 518850.SS">
    </label>
    <button id="mvRefreshBtn" type="button">刷新</button>
  </div>

  <div class="market-backtest-bar">
    <div class="market-backtest-bar__title">
      <span>规则回测</span>
      <strong id="mvBacktestRangeLabel">选择策略与区间</strong>
    </div>
    <label>策略
      <div class="multi-select-dropdown" id="mvBacktestStrategyDropdown">
        <button id="mvBacktestStrategyBtn" type="button" class="multi-select-trigger">
          <span id="mvBacktestStrategyLabel">选择策略</span>
          <span class="multi-select-arrow">▾</span>
        </button>
      </div>
    </label>
    <label>仓位策略
      <div class="multi-select-dropdown" id="mvBacktestSizerDropdown">
        <button id="mvBacktestSizerBtn" type="button" class="multi-select-trigger">
          <span id="mvBacktestSizerLabel">全仓（默认）</span>
          <span class="multi-select-arrow">▾</span>
        </button>
      </div>
    </label>
    <label>开始日期
      <input id="mvStartDate" type="date">
    </label>
    <label>结束日期
      <input id="mvEndDate" type="date">
    </label>
    <div class="market-backtest-action">
      <button id="mvRunBacktestBtn" type="button">运行回测</button>
      <div id="mvBacktestProgress" class="market-backtest-progress" hidden>
        <progress id="mvBacktestProgressBar" class="mv-backtest-progress" aria-label="回测进度" max="100" value="0"></progress>
        <span id="mvBacktestProgressText" class="market-backtest-progress-text"></span>
      </div>
    </div>
  </div>

  <div id="mvDrillBanner" class="batch-analysis-banner" hidden>
    <span id="mvDrillBannerText"></span>
    <button id="mvDrillExitBtn" type="button" class="ghost-btn batch-mini-btn mv-drill-exit">退出快照模式</button>
  </div>

  <div class="viz-panel market-chart-panel">
    <div class="market-chart-head">
      <h3 id="mvChartTitle">日 K</h3>
      <div class="mt-seg" id="mvStopModeToggle" hidden
        title="我的持仓止损线：{{ stop_mode_title }}。止损线取硬止损与吊灯止损中较高者">
        <span class="mt-seg-label">我的止损</span>
        <button type="button" data-mode="tight" class="is-active">紧止损</button>
        <button type="button" data-mode="loose">松止损</button>
      </div>
      <div id="mvRangeMeta" class="market-range-meta"></div>
    </div>
    <div id="mvStopInfoBar" class="market-stop-info" hidden></div>
    <div id="mvBacktestSummary" class="market-backtest-summary" hidden></div>

    <div class="chart-grid market-returns-grid" id="mvReturnsPanel" hidden>
      <div class="viz-panel">
        <h3 id="mvHeatTitle">月度收益热力图</h3>
        <div id="mvHeatChart" class="chart-md"></div>
      </div>
      <div class="table-panel">
        <div class="market-table-head">
          <h3 id="mvAnnualTitle">年度收益表</h3>
          <p class="context-hint">括号内为与买入持有的差值（正为跑赢）</p>
        </div>
        <div class="table-shell">
          <table id="mvAnnualTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="mvChartSkeleton" class="market-skeleton" aria-hidden="true">
      <div class="market-skeleton__bar"></div>
      <div class="market-skeleton__chart"></div>
      <div class="market-skeleton__row">
        <div class="market-skeleton__cell"></div>
        <div class="market-skeleton__cell"></div>
        <div class="market-skeleton__cell"></div>
      </div>
      <p class="market-skeleton__text">行情数据加载中…</p>
    </div>
    <div id="mvPriceChart" class="chart-kline market-price-chart"></div>

    <div id="mvMacdWrap" class="market-subchart-wrap">
      <div class="market-subchart-title">MACD</div>
      <div id="mvMacdChart" class="chart-md market-subchart"></div>
    </div>

    <div id="mvTrendWrap" class="market-subchart-wrap">
      <div class="market-subchart-title">TREND</div>
      <form id="mvTrendControls" class="market-trend-controls">
        <label>S<input id="mvTrendShort" type="number" min="1" max="300" step="1"></label>
        <label>M<input id="mvTrendMid" type="number" min="1" max="300" step="1"></label>
        <label>L<input id="mvTrendLong" type="number" min="1" max="500" step="1"></label>
        <label>ATR<input id="mvTrendAtr" type="number" min="1" max="300" step="1"></label>
        <button id="mvTrendApplyBtn" type="submit">应用</button>
      </form>
      <div id="mvTrendChart" class="chart-md market-subchart market-trend-chart"></div>
    </div>

    <div id="mvVolumeWrap" class="market-subchart-wrap">
      <div class="market-subchart-title">VOL</div>
      <div id="mvVolumeChart" class="chart-md market-subchart"></div>
    </div>

    <div id="mvRsiWrap" class="market-subchart-wrap">
      <div class="market-subchart-title">RSI</div>
      <form id="mvRsiControls" class="market-indicator-controls">
        <label>N<input id="mvRsiPeriod" type="number" min="2" max="300" step="1" value="14"></label>
        <button id="mvRsiApplyBtn" type="submit">应用</button>
      </form>
      <div id="mvRsiChart" class="chart-md market-subchart"></div>
    </div>

    <div id="mvBiasWrap" class="market-subchart-wrap">
      <div class="market-subchart-title">BIAS</div>
      <div id="mvBiasChart" class="chart-md market-subchart"></div>
    </div>
  </div>

  <div class="table-panel market-trades-panel">
    <div class="market-table-head">
      <h3>交易明细</h3>
      <p id="mvTradeMeta" class="context-hint">运行回测后显示。</p>
    </div>
    <div class="table-shell">
      <table class="market-trades-table">
        <colgroup>
          <col class="trade-col-date">
          <col class="trade-col-side">
          <col class="trade-col-qty">
          <col class="trade-col-pos">
          <col class="trade-col-price">
          <col class="trade-col-price">
          <col class="trade-col-pnl">
          <col class="trade-col-pct">
          <col class="trade-col-pct">
          <col class="trade-col-pct">
          <col class="trade-col-reason">
          <col class="trade-col-hold">
          <col class="trade-col-fee">
          <col class="trade-col-tax">
        </colgroup>
        <thead>
          <tr>
            <th>日期</th>
            <th class="text-center">方向</th>
            <th class="num-cell">数量</th>
            <th class="num-cell">仓位%</th>
            <th class="num-cell">参考价</th>
            <th class="num-cell">成交价</th>
            <th class="num-cell">交易收益</th>
            <th class="num-cell">涨跌幅</th>
            <th class="num-cell">最大浮盈</th>
            <th class="num-cell">最大回撤</th>
            <th class="num-cell">离场原因</th>
            <th class="num-cell">持有天数</th>
            <th class="num-cell">佣金</th>
            <th class="num-cell">印花税</th>
          </tr>
        </thead>
        <tbody id="mvTradesBody">
          <tr><td colspan="14">暂无交易明细。</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="content-panel market-debug-panel">
    <h3>Debug 日志</h3>
    <p id="mvDebugInfo" class="context-hint">暂无结果。</p>
    <pre id="mvDebugPreview" class="mv-debug-preview"></pre>
  </div>
</section>

<script src="/static/echarts.min.js?v={{ request.app.state.asset_version|default('1', true) if request is defined else '1' }}"></script>
<script src="/static/js/market_view.js?v={{ request.app.state.asset_version|default('1', true) if request is defined else '1' }}"></script>
{% endblock %}
