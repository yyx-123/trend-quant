{% extends "base.html" %}
{% block content %}
<section class="page-panel instruments-page">
  <p class="mobile-support-hint">本页弹窗与宽表为桌面端设计，手机端可能无法正常操作，请使用桌面浏览器。</p>
  <div class="instrument-actions">
    <button id="backfillAllBtn" type="button">一键补齐当前列表至今日</button>
    <p id="instStatus" class="status-banner">正在加载标的...</p>
  </div>
  <div id="instProgressWrap" class="inst-progress-wrap" hidden>
    <progress id="instProgress" max="1" value="0"></progress>
    <span id="instProgressText">0%</span>
  </div>
  <div id="instCompletionNotice" class="instrument-completion-notice" hidden>
    <span id="instCompletionText"></span>
    <button id="instCompletionClose" class="ghost-btn" type="button" aria-label="关闭补齐完成提示">关闭</button>
  </div>

  <div class="instrument-filter-panel">
    <div class="instrument-filter-head">
      <strong>分类筛选</strong>
      <div class="instrument-filter-actions">
        <button id="addInstrumentBtn" type="button">新增标的</button>
        <button id="instClearFiltersBtn" class="ghost-btn" type="button">清空筛选</button>
      </div>
    </div>
    <div class="instrument-filter-grid">
      <div class="instrument-filter-group">
        <div class="instrument-filter-title">一级类目</div>
        <div id="instFilterL1" class="instrument-filter-options"></div>
      </div>
      <div class="instrument-filter-group">
        <div class="instrument-filter-title">二级类目</div>
        <div id="instFilterL2" class="instrument-filter-options"></div>
      </div>
      <div class="instrument-filter-group">
        <div class="instrument-filter-title">三级类目</div>
        <div id="instFilterL3" class="instrument-filter-options"></div>
      </div>
    </div>
  </div>

  <div class="instrument-content-layout">
    <aside class="instrument-side-nav" aria-label="标的分类目录">
      <div class="instrument-side-nav-title">分类目录</div>
      <div id="instSideNav" class="instrument-side-nav-body"></div>
    </aside>

    <div class="table-shell instrument-table-shell">
      <table id="instTable">
        <colgroup>
          <col class="inst-col-symbol">
          <col class="inst-col-name">
          <col class="inst-col-category">
          <col class="inst-col-category">
          <col class="inst-col-category">
          <col class="inst-col-factor">
          <col class="inst-col-date">
          <col class="inst-col-op">
        </colgroup>
        <thead>
          <tr>
            <th>标识</th>
            <th>名称</th>
            <th>一级类目</th>
            <th>二级类目</th>
            <th>三级类目</th>
            <th>因子</th>
            <th>日期范围</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<div id="addInstrumentModal" class="instrument-modal" hidden role="dialog" aria-modal="true" aria-label="新增标的">
  <form id="addInstrumentForm" class="instrument-dialog" autocomplete="off">
    <div class="instrument-dialog-head">
      <h3>新增标的</h3>
      <button id="addInstrumentCloseBtn" class="ghost-btn" type="button" aria-label="关闭新增标的弹窗">关闭</button>
    </div>
    <div class="instrument-form-grid">
      <label>
        <span>代码</span>
        <input id="addInstrumentSymbol" type="text" placeholder="如 518850 或 518850.SH" required>
      </label>
      <label>
        <span>名称</span>
        <input id="addInstrumentName" type="text" readonly placeholder="输入代码后自动查询">
      </label>
      <div id="addCategorySelects">
        <label>
          <span>一级类目</span>
          <select id="addCategoryL1"></select>
        </label>
        <label>
          <span>二级类目</span>
          <select id="addCategoryL2"></select>
        </label>
        <label>
          <span>三级类目</span>
          <select id="addCategoryL3"></select>
        </label>
      </div>
      <p id="addCategoryAuto" class="instrument-form-message add-category-auto" hidden>
        将自动归类为 <strong id="addCategoryAutoText"></strong>（申万行业）<button id="addCategoryManualBtn" class="ghost-btn" type="button">手动选择</button>
      </p>
    </div>
    <p id="addInstrumentMsg" class="instrument-form-message"></p>
    <div class="instrument-dialog-actions">
      <button id="addInstrumentCancelBtn" class="ghost-btn" type="button">取消</button>
      <button id="addInstrumentConfirmBtn" type="submit" disabled>确认</button>
    </div>
  </form>
</div>

<div id="editInstrumentModal" class="instrument-modal" hidden role="dialog" aria-modal="true" aria-label="编辑标的">
  <form id="editInstrumentForm" class="instrument-dialog" autocomplete="off">
    <div class="instrument-dialog-head">
      <h3>编辑标的类目</h3>
      <button id="editInstrumentCloseBtn" class="ghost-btn" type="button" aria-label="关闭编辑标的弹窗">关闭</button>
    </div>
    <div class="instrument-form-grid">
      <label>
        <span>代码</span>
        <input id="editInstrumentSymbol" type="text" readonly>
      </label>
      <label>
        <span>名称</span>
        <input id="editInstrumentName" type="text" readonly>
      </label>
      <label>
        <span>一级类目</span>
        <select id="editCategoryL1" required></select>
      </label>
      <label>
        <span>二级类目</span>
        <select id="editCategoryL2" required></select>
      </label>
      <label>
        <span>三级类目</span>
        <select id="editCategoryL3" required></select>
      </label>
    </div>
    <p id="editInstrumentMsg" class="instrument-form-message"></p>
    <div class="instrument-dialog-actions">
      <button id="editInstrumentCancelBtn" class="ghost-btn" type="button">取消</button>
      <button id="editInstrumentConfirmBtn" type="submit" disabled>保存</button>
    </div>
  </form>
</div>

<div id="etfConstituentsModal" class="instrument-modal" hidden role="dialog" aria-modal="true" aria-label="ETF 前十大重仓股">
  <div class="instrument-dialog etf-constituents-dialog">
    <div class="instrument-dialog-head">
      <h3 id="etfConstituentsTitle">ETF 前十大重仓股</h3>
      <button id="etfConstituentsCloseBtn" class="ghost-btn" type="button" aria-label="关闭重仓股弹窗">关闭</button>
    </div>
    <p id="etfConstituentsFreshness" class="instrument-form-message"></p>
    <div class="table-shell etf-constituents-table-wrap">
      <table class="etf-constituents-table">
        <colgroup>
          <col class="const-col-rank">
          <col class="const-col-code">
          <col class="const-col-name">
          <col class="const-col-weight">
          <col class="const-col-category">
          <col class="const-col-status">
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>代码</th>
            <th>名称</th>
            <th>权重%</th>
            <th>申万类目</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="etfConstituentsBody"></tbody>
      </table>
    </div>
    <p id="etfConstituentsMsg" class="instrument-form-message"></p>
    <div class="instrument-dialog-actions">
      <button id="etfConstituentsImportBtn" type="button">导入全部未管理标的</button>
    </div>
  </div>
</div>

<script src="/static/js/instruments.js?v={{ request.app.state.asset_version|default('1', true) if request is defined else '1' }}"></script>
{% endblock %}
