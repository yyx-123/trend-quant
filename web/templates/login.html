<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} | 趋势 ETF 系统</title>
  <link rel="stylesheet" href="/static/style.css?v={{ request.app.state.asset_version|default('1', true) if request is defined else '1' }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="site-eyebrow">趋势跟踪工作台</p>
    <h1 class="login-title">趋势 ETF 系统</h1>
    <form id="loginForm" class="login-form">
      <label>用户名
        <input id="loginUsername" type="text" autocomplete="username" autofocus>
      </label>
      <label>密码
        <input id="loginPassword" type="password" autocomplete="current-password">
      </label>
      <button id="loginBtn" type="submit">登录</button>
      <div id="loginMessage" class="instrument-form-message" hidden></div>
    </form>
  </main>
  <script>
  (function() {
    const formEl = document.getElementById('loginForm');
    const usernameEl = document.getElementById('loginUsername');
    const passwordEl = document.getElementById('loginPassword');
    const btnEl = document.getElementById('loginBtn');
    const messageEl = document.getElementById('loginMessage');

    // 登录成功后跳回来源页；仅接受站内相对路径，防开放重定向
    function nextUrl() {
      const next = new URLSearchParams(location.search).get('next') || '/';
      return (next.startsWith('/') && !next.startsWith('//')) ? next : '/';
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add('is-error');
      messageEl.hidden = !text;
    }

    formEl.addEventListener('submit', async function(ev) {
      ev.preventDefault();
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (!username || !password) { showMessage('请输入用户名和密码'); return; }
      btnEl.disabled = true;
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: username, password: password}),
        });
        const data = await resp.json();
        if (!resp.ok) { showMessage(data.detail || '登录失败'); return; }
        location.href = nextUrl();
      } catch (err) {
        showMessage('网络错误，请稍后重试');
      } finally {
        btnEl.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
