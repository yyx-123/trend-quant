{% extends "base.html" %}
{% block content %}
<section class="page-panel manual-trade-page">
  <!-- ① 试算区：不落库 -->
  <div class="bt-form-row manual-trade-form">
    <label>标的代码
      <input id="mtSymbol" type="text" list="mtSymbolOptions" placeholder="如 510300 或 510300.SS" autocomplete="off">
      <datalist id="mtSymbolOptions"></datalist>
    </label>
    <label>买入日期
      <input id="mtBuyDate" type="date">
    </label>
    <label>买入价格
      <input id="mtBuyPrice" type="number" min="0" step="0.0001" placeholder="如 4.025">
    </label>
    <label>风险预算（元）
      <input id="mtRiskBudget" type="number" min="0" step="100" placeholder="选填，如 10000"
        title="可承受的最大亏损金额：按硬止损触发的每股损失推算最大可买入份数（下取整到百位）">
    </label>
    <button id="mtEvaluateBtn" type="button">试算</button>
  </div>
  <div id="mtPriceHint" class="mt-price-hint" hidden></div>
  <div id="mtMessage" class="instrument-form-message" hidden></div>

  <div id="mtResult" hidden>
    <div class="viz-panel">
      <h3 id="mtSummaryTitle">止损价</h3>
      <div class="mt-stop-grid" id="mtStopStats"></div>
    </div>

    <div class="viz-panel" id="mtSizingPanel" hidden>
      <h3>仓位试算</h3>
      <div id="mtHoldingStats"></div>
    </div>
  </div>

  <!-- ② 持仓记录区（全站登录墙内，进入本页即已登录） -->
  <div class="viz-panel" id="mtRecordsPanel">
    <div class="mt-records-head">
      <h3>持仓记录</h3>
      <div class="mt-records-range">
        <div class="mt-seg" id="mtTimeFilter" role="group" aria-label="时间范围"
          title="按买入日期的自然日筛选：近三个月=三个月前同日至今，近六个月=六个月前同日至今，今年来=1 月 1 日至今，自定义=起止日期闭区间">
          <span class="mt-seg-label">时间</span>
          <button type="button" data-range="3m" class="is-active">近三个月</button>
          <button type="button" data-range="6m">近六个月</button>
          <button type="button" data-range="ytd">今年来</button>
          <button type="button" data-range="custom">自定义</button>
        </div>
        <span class="mt-range-custom" id="mtTimeCustom" hidden>
          <input type="date" id="mtTimeFrom" aria-label="开始日期">
          <span class="mt-range-sep">~</span>
          <input type="date" id="mtTimeTo" aria-label="结束日期">
        </span>
      </div>
      <div class="mt-records-controls">
        <div class="mt-seg" id="mtStopModeToggle" role="group" aria-label="止损松紧"
          title="{{ stop_mode_title }}。切换后持仓记录与试算同步生效">
          <span class="mt-seg-label">止损</span>
          <button type="button" data-mode="tight" class="is-active">紧止损</button>
          <button type="button" data-mode="loose">松止损</button>
        </div>
        <button id="mtOpenEnterBtn" type="button" class="mt-btn-sm">+ 录入</button>
        <button id="mtRefreshBtn" type="button" class="mt-btn-sm">刷新</button>
      </div>
    </div>
    <div class="mt-trade-list" id="mtTradeList"></div>
    <div id="mtTradeEmpty" class="manual-trade-note" hidden>暂无持仓记录，点击右上角「录入」添加第一笔。</div>
  </div>

  <!-- ③ 清仓交易区：清仓统计 + 盈亏热力图 + 已清仓明细 -->
  <div class="viz-panel" id="mtClosedPanel">
    <div class="mt-records-head">
      <h3>清仓交易</h3>
      <div class="mt-records-range">
        <div class="mt-seg" id="mtClosedTimeFilter" role="group" aria-label="时间范围"
          title="按清仓日期（卖出日期）的自然日筛选：近三个月=三个月前同日至今，近六个月=六个月前同日至今，今年来=1 月 1 日至今，自定义=起止日期闭区间；统计与热力图同步变化">
          <span class="mt-seg-label">时间</span>
          <button type="button" data-range="3m" class="is-active">近三个月</button>
          <button type="button" data-range="6m">近六个月</button>
          <button type="button" data-range="ytd">今年来</button>
          <button type="button" data-range="custom">自定义</button>
        </div>
        <span class="mt-range-custom" id="mtClosedTimeCustom" hidden>
          <input type="date" id="mtClosedTimeFrom" aria-label="开始日期">
          <span class="mt-range-sep">~</span>
          <input type="date" id="mtClosedTimeTo" aria-label="结束日期">
        </span>
      </div>
    </div>
    <div class="mt-stop-grid mt-closed-stats" id="mtClosedStats" hidden></div>
    <div class="mt-heat" id="mtHeatPanel" hidden>
      <div class="mt-heat-head">
        <h4>股票热力图 · 盈亏</h4>
        <span class="manual-trade-note" id="mtHeatNote"></span>
      </div>
      <div class="mt-heat-chart" id="mtHeatChart"></div>
    </div>
    <div class="mt-trade-list" id="mtClosedList"></div>
    <div id="mtClosedEmpty" class="manual-trade-note" hidden>暂无清仓交易。</div>
  </div>

  <!-- 录入弹窗 -->
  <div id="mtEnterModal" class="mt-modal" hidden role="dialog" aria-modal="true" aria-label="录入买入">
    <div class="mt-modal-box">
      <h3>录入交易</h3>
      <div class="bt-form-row">
        <label>标的代码
          <input id="mtEnterSymbol" type="text" list="mtSymbolOptions" placeholder="如 510300 或 510300.SS" autocomplete="off">
        </label>
        <label>买入日期
          <input id="mtEnterDate" type="date">
        </label>
        <label>买入价格
          <input id="mtEnterPrice" type="number" min="0" step="0.0001" placeholder="如 4.025">
        </label>
        <label>买入份数
          <input id="mtEnterShares" type="number" min="0" step="1" placeholder="如 1000">
        </label>
        <button id="mtEnterConfirmBtn" type="button">确认录入</button>
        <button id="mtEnterCancelBtn" type="button" class="mt-btn-ghost">取消</button>
      </div>
      <div id="mtEnterHint" class="mt-price-hint" hidden></div>
      <div id="mtEnterMessage" class="instrument-form-message" hidden></div>
    </div>
  </div>

  <!-- 清仓弹窗 -->
  <div id="mtCloseModal" class="mt-modal" hidden role="dialog" aria-modal="true" aria-label="清仓">
    <div class="mt-modal-box">
      <h3 id="mtCloseTitle">清仓</h3>
      <div class="bt-form-row">
        <label>清仓日期
          <input id="mtSellDate" type="date">
        </label>
        <label>清仓价格
          <input id="mtSellPrice" type="number" min="0" step="0.0001">
        </label>
        <button id="mtCloseConfirmBtn" type="button">确认清仓</button>
        <button id="mtCloseCancelBtn" type="button" class="mt-btn-ghost">取消</button>
      </div>
      <div id="mtCloseHint" class="mt-price-hint" hidden></div>
      <div id="mtCloseMessage" class="instrument-form-message" hidden></div>
    </div>
  </div>
</section>

<script src="/static/echarts.min.js?v={{ request.app.state.asset_version|default('1', true) }}"></script>
<script src="/static/js/manual_trade.js?v={{ request.app.state.asset_version|default('1', true) }}"></script>

{% endblock %}
