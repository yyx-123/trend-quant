{% extends "base.html" %}
{% block content %}
<section class="index-board-page">
  <section id="heatmapPanel" class="heatmap-panel" hidden>
    <div class="heatmap-head">
      <div id="heatmapTabs" class="heatmap-tabs" role="tablist" aria-label="一级类目切换"></div>
      <div id="heatmapDim" class="heatmap-dim" role="radiogroup" aria-label="热力图着色维度">
        <span class="heatmap-dim-label">着色</span>
        <button type="button" role="radio" aria-checked="true" class="heatmap-dim-btn is-active" data-dim="ma5">趋势 MA5</button>
        <button type="button" role="radio" aria-checked="false" class="heatmap-dim-btn" data-dim="score">当日趋势值</button>
        <button type="button" role="radio" aria-checked="false" class="heatmap-dim-btn" data-dim="change">日涨跌幅</button>
      </div>
      <div class="heatmap-legend" aria-hidden="true">
        <span class="heatmap-legend-label">下跌</span>
        <span class="heatmap-legend-bar"></span>
        <span class="heatmap-legend-label">上涨</span>
        <span class="heatmap-legend-na"></span>
        <span class="heatmap-legend-label">数据不足</span>
      </div>
    </div>
    <div id="heatmapChart" class="heatmap-chart"></div>
    <div id="heatmapCrumb" class="heatmap-crumb" hidden></div>
    <p class="heatmap-note">面积 = 每个标的等大面积（类目块大小 ∝ 标的数量，与成交额无关） · 颜色 = <span id="heatmapColorNote">最新趋势值 MA5</span>（红涨绿跌、深浅随绝对值，类目为成员成交额加权） · 点击色块下钻，底部面包屑返回 · 悬停查看详情</p>
  </section>
  <div class="subject-status-row">
    <div id="subjectBoardStatus" class="context-hint">正在加载标的看板…</div>
  </div>
  <div class="instrument-content-layout">
    <aside class="instrument-side-nav" aria-label="标的分类目录">
      <div class="instrument-side-nav-title">分类目录</div>
      <div id="subjectSideNav" class="instrument-side-nav-body"></div>
    </aside>
    <div id="subjectBoard" class="index-board"></div>
  </div>
</section>

<!-- 仓位试算弹窗：与手工交易页试算同接口（/manual-trade/api/evaluate）、同口径 -->
<div id="trialModal" class="instrument-modal" hidden>
  <div class="instrument-dialog trial-dialog">
    <div class="instrument-dialog-head">
      <h3 id="trialTitle">仓位试算</h3>
      <button id="trialCloseBtn" class="ghost-btn" type="button" aria-label="关闭试算弹窗">关闭</button>
    </div>
    <div class="bt-form-row trial-form">
      <label>标的
        <input id="trialSymbol" type="text" readonly>
      </label>
      <label>买入日期
        <input id="trialBuyDate" type="date">
      </label>
      <label>买入价格
        <input id="trialBuyPrice" type="number" min="0" step="0.0001" placeholder="如 4.025">
      </label>
      <label>风险预算（元）
        <input id="trialRiskBudget" type="number" min="0" step="100" placeholder="选填，如 10000"
          title="可承受的最大亏损金额：按硬止损触发的每股损失推算最大可买入份数（下取整到百位）">
      </label>
      <button id="trialRunBtn" type="button">试算</button>
    </div>
    <div id="trialPriceHint" class="mt-price-hint" hidden></div>
    <p id="trialMessage" class="instrument-form-message" hidden></p>
    <div id="trialResult" hidden>
      <h3 id="trialSummaryTitle" class="trial-result-title">止损价</h3>
      <div class="mt-stop-grid" id="trialStopStats"></div>
      <div id="trialSizing" class="trial-sizing" hidden></div>
    </div>
  </div>
</div>
<script src="/static/echarts.min.js?v={{ request.app.state.asset_version|default('1', true) if request is defined else '1' }}"></script>
<script src="/static/js/subject_market.js?v={{ request.app.state.asset_version|default('1', true) if request is defined else '1' }}"></script>
{% endblock %}
